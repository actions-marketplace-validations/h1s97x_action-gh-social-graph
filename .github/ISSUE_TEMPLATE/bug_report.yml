name: Bug Report / Bug 报告
description: Report a problem with the action / 报告 Action 的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below to help us reproduce and fix it quickly.
        感谢报告 Bug！请填写以下表单，帮助我们快速复现并修复。

  - type: input
    id: action-version
    attributes:
      label: Action version / Action 版本
      description: Which version of the action are you using? (e.g. `v1`, `main`) / 你使用的是哪个版本？
      placeholder: "v1"
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow configuration / 工作流配置
      description: Paste the workflow YAML that triggers the action / 粘贴触发该 Action 的工作流 YAML
      render: yaml
      placeholder: |
        name: Example
        on: [pull_request]
        jobs:
          analyze:
            runs-on: ubuntu-latest
            steps:
              - uses: h1s97x/action-gh-social-graph@v1
                with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Describe the exact steps / 描述精确的复现步骤
      placeholder: |
        1. Open a pull request
        2. Wait for the action to run
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
      description: What did you expect to happen? / 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: What actually happened? Include error logs if available / 实际发生了什么？如有错误日志请一并提供
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: Runner OS, node version, etc. / 运行环境（操作系统、Node 版本等）
      placeholder: "ubuntu-latest, Node 20"

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification / 确认
      description: Please confirm before submitting / 提交前请确认
      options:
        - label: I have searched existing issues for the same problem / 我已搜索过现有 Issue，确认没有相同问题
          required: true
